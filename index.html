<style>
:root{
  --paper:#FBF8F3; --surface:#FFFFFF; --ink:#1F2A28; --ink2:#5B6764; --line:#E6E0D4; --field:#D5CEBF; --soft:#F1ECE2;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#D9F0EC; --accent-deep:#0B5C55;
  --ok:#0F6B3A; --ok-soft:#DDF3E6; --warn:#8A4B00; --warn-soft:#FFEBCC; --bad:#B42318; --bad-soft:#FEE4E2;
  --box:#1F2A28; --box-ink:#FBF8F3; --box-dim:#D5CEBF;
  --f-display:"Almarai","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"Almarai","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121918; --surface:#1B2423; --ink:#E8EFEC; --ink2:#A7B6B2; --line:#2B3836; --field:#3A4A47; --soft:#24302E;
    --accent:#5CCFC2; --accent-ink:#04201D; --accent-soft:#17403B; --accent-deep:#9FE8DF;
    --ok:#62CF92; --ok-soft:#14301F; --warn:#F1B65E; --warn-soft:#35280F; --bad:#FF8F86; --bad-soft:#3B1A18;
    --box:#0C2A26; --box-ink:#E8EFEC; --box-dim:#A7C4BF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121918; --surface:#1B2423; --ink:#E8EFEC; --ink2:#A7B6B2; --line:#2B3836; --field:#3A4A47; --soft:#24302E;
  --accent:#5CCFC2; --accent-ink:#04201D; --accent-soft:#17403B; --accent-deep:#9FE8DF;
  --ok:#62CF92; --ok-soft:#14301F; --warn:#F1B65E; --warn-soft:#35280F; --bad:#FF8F86; --bad-soft:#3B1A18;
  --box:#0C2A26; --box-ink:#E8EFEC; --box-dim:#A7C4BF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:86px}
body{
  background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--f-body);
  padding-block:0 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.sheet-open{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.wrap,.top-in,.bnav-in{max-width:760px;margin-inline:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
.brand .eyebrow{line-height:1.2}
h1{font:800 21px/1.3 var(--f-display);margin:0;min-width:0;overflow-wrap:anywhere}
.badge{flex:none;display:inline-flex;align-items:center;gap:6px;font:700 12.5px/1 var(--f-body);color:var(--ink2);padding:6px 4px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.badge[data-s="saving"]{color:var(--warn)}
.badge[data-s="saving"]::before{background:var(--warn)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;background:none;border:0;border-radius:14px;font:700 12px/1.2 var(--f-body);color:var(--ink2);cursor:pointer;padding:4px}
.tab .ic{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent-deep);font-weight:800}
.tab[aria-selected="true"] .ic{background:var(--accent-soft)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:block;outline:0}
.band{background:var(--surface);border-radius:22px;padding:18px 16px;margin-top:12px}
.plain{margin-top:12px}
.h2{font:800 22px/1.3 var(--f-display);margin:0}
.h3{font:800 17px/1.4 var(--f-display);margin:0 0 12px}
.lead{color:var(--ink2);margin:8px 0 16px;max-width:60ch}
.eyebrow{font:500 12.5px/1.3 var(--f-body);color:var(--ink2)}
.lbl,label{font:500 12.5px/1.3 var(--f-body);color:var(--ink2)}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:8px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.in{width:100%;min-width:0;min-height:48px;padding:9px 12px;border:1.5px solid var(--field);border-radius:var(--r);background:var(--paper);color:var(--ink);font:600 16px var(--f-body)}
.in[dir="ltr"]{text-align:left}
.in[data-auto="1"]{color:var(--ink2)}
.in.big-in{min-height:54px;font:800 21px var(--f-body)}
.in.big-in[dir="ltr"]{text-align:center}
.in.big-in[data-auto="1"]{background:var(--soft);border-color:var(--soft)}
.in.curr{border:2px solid var(--accent)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.big{font-weight:800;font-size:18px;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border:1.5px solid var(--field);border-radius:var(--r);background:var(--surface);color:var(--ink);font:700 14.5px var(--f-body);cursor:pointer;text-decoration:none;text-align:center}

.btn.line{border-color:var(--accent);color:var(--accent-deep);background:var(--surface)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent-deep)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.month-title{text-align:center;min-width:0}

.nbtn{flex:none;width:44px;height:44px;border:0;border-radius:22px;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.nbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0;background:var(--surface);border-radius:16px;padding:10px 12px}
.tile:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.tile .lbl{display:block}
.tile .big{font-size:17px;white-space:nowrap}
.tile-in{display:block;width:100%;min-width:0;border:0;padding:0;background:transparent;color:var(--accent-deep);font:800 17px/1.6 var(--f-body);text-align:right;outline:0}
.tile-in[data-auto="1"]{color:var(--ink)}
.status{margin:10px 0 0;padding:7px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.status[data-k="warn"]{background:var(--warn-soft)}
.status[data-k="bad"]{background:var(--bad-soft)}
.status[data-k="ok"]{background:var(--ok-soft)}
.status .btn{min-height:36px;padding:0 10px;margin-inline-start:6px}
.apts,.rows{list-style:none;margin:0;padding:0}
.apt{padding:14px 0;border-top:1px solid var(--line)}
.apt:first-child{border-top:0;padding-top:0}
.alist{display:flex;flex-direction:column;gap:8px}
.alist > .apt,.alist > .apt:first-child{padding:0;border:0}
.apt-name,.aname{font:800 16px/1.3 var(--f-display);overflow-wrap:anywhere}
.apt-sub,.asub{color:var(--ink2);font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.arow{width:100%;min-height:68px;border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:start;cursor:pointer;font:inherit}
.arow:hover{outline:2px solid var(--line)}
.av{flex:none;width:46px;height:46px;border-radius:23px;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font:800 19px/1 var(--f-body);overflow:hidden}
.av[data-k="todo"],.av[data-k="pending"]{background:var(--soft);color:var(--ink2)}
.av.lg{width:50px;height:50px;border-radius:25px;font-size:22px}
.ainfo{flex:1;min-width:0;display:block}
.ainfo > span{display:block}
.aend{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.aamt{font:800 17px/1.3 var(--f-body)}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.floor{margin-top:18px}
.floor:first-child{margin-top:0}
.floor-head,.floor-bar{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 4px;margin:0 0 8px;background:none;border:0;color:var(--ink);font:800 18px/1.3 var(--f-display);text-align:start}
.floor-head{cursor:pointer}
.floor-bar{background:var(--accent-soft);border-radius:12px;padding:8px 14px;font-size:16px}
.fl-sub{font:500 13px/1.3 var(--f-body);color:var(--ink2);margin-inline-start:auto}
.fl-chev{flex:none;width:9px;height:9px;border-inline-end:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-top:-4px}
.floor-head[aria-expanded="false"] .fl-chev{transform:rotate(-135deg);margin-top:4px}
.chips{display:flex;gap:8px;margin:0 0 6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips .btn{flex:none;min-height:38px;padding:0 14px;border-radius:999px;font-size:13.5px}
.search{margin:0 0 12px}
.search .in{min-height:50px;border-radius:16px;background:var(--surface);border-color:var(--surface)}
.pill{display:inline-flex;align-items:center;padding:2px 11px;border-radius:999px;font:700 12.5px/1.5 var(--f-body);white-space:nowrap;background:var(--soft);color:var(--ink2)}
.pill[data-k="paid"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-k="partial"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-k="unpaid"]{background:var(--bad-soft);color:var(--bad)}
.pill[data-k="todo"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-deep);font-weight:800}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .sub{color:var(--ink2);font-size:13.5px}
.edit-form{display:grid;gap:12px;margin-top:10px}
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(31,42,40,.55)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:sheet-up .2s ease-out;outline:0}
@keyframes sheet-up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.grab{flex:none;align-self:center;width:40px;height:5px;border-radius:3px;background:var(--field)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-id{display:flex;align-items:center;gap:12px;min-width:0}
.sh-id .asub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.x{flex:none;width:44px;height:44px;border:0;border-radius:22px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.issue{margin:-4px 0 0;font-size:13.5px;color:var(--bad)}
.calc{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent-deep);padding:8px 14px}
.calc .lbl{display:block;color:var(--accent-deep)}
.calc .big{font-size:19px}
.calc > div:last-child{text-align:end}
.duebox{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;background:var(--box);color:var(--box-ink);padding:10px 14px}
.duebox .lbl{display:block;color:var(--box-dim)}
.duebox .big{font-size:26px;line-height:1.2}
.duebox .btn{background:var(--box-ink);border-color:var(--box-ink);color:var(--box)}
.shbtns{display:flex;flex-wrap:wrap;gap:10px}
.shbtns .btn{flex:1 1 130px}
.toast{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast[hidden]{display:none}
.toast span{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r);font-weight:600;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.loading{padding:48px 0;color:var(--ink2);text-align:center}
.badge[data-s="offline"]{color:var(--bad)}
.badge[data-s="offline"]::before{background:var(--bad)}
body.nonav{padding-block:0 32px}
body.nonav .bnav{display:none}
@media (max-width:359px){ .tiles{grid-template-columns:1fr 1fr} .tiles .tile:last-child{grid-column:1/-1} }
@media (min-width:560px){ .sheet-wrap{align-items:center} .sheet{border-radius:28px;max-height:88vh} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';

/*LOGIC-START*/
var MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function normDigits(s){
  return String(s)
    .replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-0x660);})
    .replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-0x6F0);})
    .replace(/٫/g,'.').replace(/٬/g,',');
}
function num(v){
  if(v===null||v===undefined) return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  var s=normDigits(v).trim().replace(/\s+/g,'');
  if(s==='') return null;
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  var n=parseFloat(s);
  return isFinite(n)?n:null;
}
function toCents(n){ return (n===null||n===undefined||!isFinite(n))?null:Math.round(n*100); }
function round3(x){ return Math.round(x*1000)/1000; }
/* A period key is YYYY-MM-H: H=1 covers days 1-15, H=2 covers day 16 to the end of the month (a half-month statement). */
function isValidYm(s){ return typeof s==='string'&&/^\d{4}-(0[1-9]|1[0-2])-[12]$/.test(s); }
function ymParts(ym){ var p=ym.split('-'); return {y:Number(p[0]),m:Number(p[1]),h:Number(p[2])}; }
function ymLabel(ym){ var p=ymParts(ym); return (p.h===1?'النصف الأول':'النصف الثاني')+' من '+MONTHS_AR[p.m-1]+' '+p.y; }
function ymRange(ym){
  var p=ymParts(ym), last=new Date(p.y,p.m,0).getDate();
  return 'من '+(p.h===1?1:16)+' إلى '+(p.h===1?15:last)+' '+MONTHS_AR[p.m-1];
}
function ymShift(ym,d){
  var p=ymParts(ym), i=p.y*24+(p.m-1)*2+(p.h-1)+d;
  var y=Math.floor(i/24), r=i-y*24;
  return y+'-'+String(Math.floor(r/2)+1).padStart(2,'0')+'-'+(r%2+1);
}
function ymNow(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+(d.getDate()<=15?1:2); }

function fmtMoney(c){ return (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n){ return (n===null||n===undefined)?'—':(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}); }
function fmtRead(n){ return (n===null||n===undefined)?'—':String(Math.round(n*100)/100); }
function fmtPrice(p){
  if(p===null||p===undefined) return '—';
  var s=String(Math.round(p*10000)/10000);
  if(s.indexOf('.')<0) return s+'.00';
  if(/\.\d$/.test(s)) return s+'0';
  return s;
}

function isActive(a,ym){ return (!a.from||a.from<=ym)&&(!a.to||a.to>=ym); }

/* Floors: every apartment has a floor number (0 = ground). Apartments are shown grouped by floor. */
var FLOORS_AR=['الأرضي','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
function floorLabel(n){ n=Number(n); if(!isFinite(n)||n<0) n=1; n=Math.floor(n); return 'الطابق '+(n<FLOORS_AR.length?FLOORS_AR[n]:n); }
function floorOf(a){ var f=(a.floor===undefined||a.floor===null||a.floor==='')?1:Number(a.floor); return (isFinite(f)&&f>=0)?Math.floor(f):1; }
function groupByFloor(apts){
  var map={}, groups=[];
  apts.forEach(function(a){ var f=floorOf(a); if(!map[f]){ map[f]={floor:f,apts:[]}; groups.push(map[f]); } map[f].apts.push(a); });
  groups.sort(function(x,y){return x.floor-y.floor;});
  return groups;
}
/* The first floor that still has room for another apartment, else a new floor.
   The ground floor (0) has its own capacity "ground" (0 = no ground-floor apartments); every other floor holds "perFloor". */
function groundCap(v){ var g=Math.round(Number(v)); return (isFinite(g)&&g>0)?Math.min(30,g):0; }
function autoFloor(apts,perFloor,ground){
  var per=Math.max(1,Math.round(Number(perFloor))||6), g=groundCap(ground), counts={}, max=0;
  apts.forEach(function(a){ var f=floorOf(a); counts[f]=(counts[f]||0)+1; if(f>max) max=f; });
  for(var f=0;f<=max;f++) if((counts[f]||0)<(f===0?g:per)) return f;
  return max+1;
}
function aptCountLabel(n){ return n===1?'شقة واحدة':n===2?'شقتان':n<=10?n+' شقق':n+' شقة'; }
function paidCents(rec,id){

}
/* dueC = what is still owed after payments (arrears + this month - paid). */
function statusOf(dueC,paidC){
  if(dueC===null||dueC===undefined) return 'pending';
  if(dueC<=0) return 'paid';
  if(paidC>0) return 'partial';
  return 'unpaid';
}

/* m: {price, readings:{id:{prev,curr}}}; apts: active apartments for that period.
   Consumption is always current reading minus previous reading; it can't be typed in. */
function computeMonth(m,apts){
  var res={ok:false,reason:null,rows:[],missing:[],negative:[],totalC:0,sumKwh:0,price:null};
  var price=num(m.price);
  res.price=(price!==null&&price>=0)?price:null;
  var sum=0, complete=true;
  apts.forEach(function(a){
    var r=(m.readings&&m.readings[a.id])||{};
    var prev=num(r.prev), curr=num(r.curr);
    var row={id:a.id,prev:prev,curr:curr,kwh:null,issue:null,shareC:null};
    if(prev===null||curr===null){ row.issue='missing'; complete=false; res.missing.push(a.id); }
    else if(curr<prev){ row.issue='negative'; complete=false; res.negative.push(a.id); }
    else { row.kwh=round3(curr-prev); sum+=row.kwh; }
    res.rows.push(row);
  });
  res.sumKwh=round3(sum);
  if(!apts.length){ res.reason='no-apartments'; return res; }
  if(res.price===null){ res.reason='no-price'; return res; }
  if(!complete){ res.reason='incomplete'; return res; }
  var pm=Math.round(res.price*10000), total=0;
  res.rows.forEach(function(r){
    r.shareC=Math.round(Math.round(r.kwh*1000)*pm/100000);
    total+=r.shareC;
  });
  res.totalC=total;
  res.ok=true;
  return res;
}

function lastCurrBefore(months,aptId,ym){
  var keys=Object.keys(months).filter(function(k){return isValidYm(k)&&k<ym;}).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var m=months[keys[i]];
    var c=num(m&&m.readings&&m.readings[aptId]&&m.readings[aptId].curr);
    if(c!==null) return c;
  }
  return null;
}
function lastPriceBefore(months,ym){
  var keys=Object.keys(months).filter(function(k){return isValidYm(k)&&k<ym;}).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var p=num(months[keys[i]]&&months[keys[i]].price);
    if(p!==null) return p;
  }
  return null;
}
function effMonth(months,ym,apts){
  var rec=months[ym]||{};
  var price=num(rec.price), priceAuto=(price===null);
  if(priceAuto) price=lastPriceBefore(months,ym);
  var readings={};
  apts.forEach(function(a){
    var r=(rec.readings&&rec.readings[a.id])||{};
    var prev=num(r.prev), auto=(prev===null);
    if(auto) prev=lastCurrBefore(months,a.id,ym);
    readings[a.id]={prev:prev,curr:num(r.curr),auto:auto,
      prevRaw:r.prev==null?'':String(r.prev),currRaw:r.curr==null?'':String(r.curr)};
  });
  return {price:price,priceAuto:priceAuto,priceRaw:rec.price==null?'':String(rec.price),readings:readings,paid:rec.paid||{}};
}
function viewCore(building,months,ym){
  var apts=building.apartments.filter(function(a){return isActive(a,ym);});

}
/* What each apartment still owed when month ym starts (typed-in arrears win over the running balance). */
function carryBefore(building,months,ym){
  var carry={};
  Object.keys(months).filter(function(k){return isValidYm(k)&&k<ym;}).sort().forEach(function(k){
    var v=viewCore(building,months,k), rec=months[k]||{}, arr={}, typed={};
    v.apts.forEach(function(a){
      var o=num(rec.arrears&&rec.arrears[a.id]);
      typed[a.id]=(o!==null);
      arr[a.id]=(o===null)?(carry[a.id]||0):toCents(o);
    });
    if(v.res.ok) v.res.rows.forEach(function(r){ carry[r.id]=arr[r.id]+r.shareC-paidCents(rec,r.id); });
    else v.apts.forEach(function(a){ if(typed[a.id]) carry[a.id]=arr[a.id]; });
  });
  return carry;
}
function monthView(building,months,ym){
  var v=viewCore(building,months,ym);
  var carry=carryBefore(building,months,ym), rec=months[ym]||{};
  v.arr={}; v.arrAuto={}; v.due={};
  v.apts.forEach(function(a){
    var o=num(rec.arrears&&rec.arrears[a.id]);
    v.arrAuto[a.id]=(o===null);
    v.arr[a.id]=(o===null)?(carry[a.id]||0):toCents(o);
  });
  if(v.res.ok) v.res.rows.forEach(function(r){ v.due[r.id]=v.arr[r.id]+r.shareC-paidCents(rec,r.id); });
  return v;
}
function arrearsCents(building,months,aptId,ym){
  var v=monthView(building,months,ym);
  if(aptId in v.arr) return v.arr[aptId];
  return carryBefore(building,months,ym)[aptId]||0;
}

/* Minimal PDF writer: every page is one JPEG that fills an A4 sheet. */
function buildPdf(pages){
  var enc=new TextEncoder(), chunks=[], offset=0, offsets=[];
  function push(x){ var b=(typeof x==='string')?enc.encode(x):x; chunks.push(b); offset+=b.length; }
  function obj(n,body){ offsets[n]=offset; push(n+' 0 obj\n'+body+'\nendobj\n'); }
  var W='595.28', H='841.89';
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids=pages.map(function(p,i){return (3+3*i)+' 0 R';}).join(' ');
  obj(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>');
  pages.forEach(function(p,i){
    var pg=3+3*i, ct=4+3*i, im=5+3*i;
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>');
    var content='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    obj(ct,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
    offsets[im]=offset;
    push(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpeg.length+' >>\nstream\n');
    push(p.jpeg);
    push('\nendstream\nendobj\n');
  });
  var total=3+3*pages.length, xref=offset, x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(var n=1;n<total;n++) x+=String(offsets[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  var len=0; chunks.forEach(function(c){len+=c.length;});
  var out=new Uint8Array(len), pos=0;
  chunks.forEach(function(c){out.set(c,pos);pos+=c.length;});
  return out;
}

/* Replaces everything (new setup, restore from backup, clear). Chunked because a batch holds at most 500 writes. */

  var meta=metaDoc(); ops.push(function(b){ b.set(db.doc('building/main'),meta); }); fb.baseMeta=JSON.stringify(meta);
  var cur={}, nb={};

  fb.base=nb;
  var ids={};

    ops.push(function(b){ b.set(db.doc('periods/'+k),m); });

function onBuildingSnap(s){

function onAptsSnap(qs){

function startSetup(){
  var n=Math.round(num(valOf('s-count'))||0);
  if(n<1||n>60){ toast('اكتب عدد الشقق بين 1 و 60.'); return; }
  var per=Math.round(num(valOf('s-per'))||6);
  if(per<1||per>30){ toast('اكتب عدد الشقق في كل طابق بين 1 و 30.'); return; }
  var gv=num(valOf('s-ground')), gr=gv===null?0:Math.round(gv);
  if(gr<0||gr>30||gr>n){ toast('اكتب عدد شقق الطابق الأرضي بين 0 وعدد الشقق الكلي.'); return; }
  S.b={name:valOf('s-name'),cc:S.b.cc||'970',perFloor:per,ground:gr,sample:false,apartments:[]};
  var cnt={};
  for(var i=1;i<=n;i++){
    var fl=i<=gr?0:Math.floor((i-gr-1)/per)+1; cnt[fl]=(cnt[fl]||0)+1;
    S.b.apartments.push({id:uid(),name:aptNameFor(fl,cnt[fl],S.b),tenant:'',phone:'',cc:'',floor:fl,from:'',to:''});
  }
  S.months={}; ui.tab='apts'; ui.ym=ymNow();
  persistAll(); renderAll();
  toast('تمت إضافة الشقق. اكتب أسماء السكان وأرقامهم، ثم انتقل إلى الكشف.');
}
function loadSample(){
  var s=makeSample(); S.b=s.b; S.months=s.months; ui.tab='month'; ui.ym='2026-10-1';
  persistAll(); renderAll();
}
function clearAll(){
  S.b={name:'',cc:S.b.cc||'970',perFloor:S.b.perFloor||6,ground:groundCap(S.b.ground),sample:false,apartments:[]}; S.months={};
  persistAll(); ui.tab='month'; ui.ym=ymNow(); ui.confirm=null; renderAll();
}

  }).join('');
}

function applySearch(){
  var inp=document.getElementById('f-search');
  var q=inp?normDigits(inp.value.trim()).toLowerCase():'';
  ui.search=inp?inp.value:'';
  var lis=main.querySelectorAll('.alist > .apt'), shown=0, i;
  for(i=0;i<lis.length;i++){ var hit=!q||(lis[i].dataset.q||'').indexOf(q)!==-1; lis[i].hidden=!hit; if(hit) shown++; }
  var floors=main.querySelectorAll('.floor');
  for(i=0;i<floors.length;i++){
    var fl=floors[i], n=fl.id.replace('fl-',''), ul=fl.querySelector('.apts');
    fl.hidden=!!q&&!fl.querySelector('.alist > .apt:not([hidden])');
    if(ul) ul.hidden=q?false:!!ui.collapsed[n];
  }
  var none=document.getElementById('f-none'); if(none) none.hidden=!(q&&shown===0);
}
function openApt(id){
  closeApt();
  var li=null, all=main.querySelectorAll('.apt[data-apt]');
  for(var i=0;i<all.length;i++) if(all[i].dataset.apt===id){ li=all[i]; break; }
  if(!li) return;
  var w=li.querySelector('.sheet-wrap'); if(!w) return;
  w.hidden=false; ui.open=id; document.body.classList.add('sheet-open');
  var curr=li.querySelector('[data-f="curr"]'), sh=li.querySelector('.sheet');
  var target=(curr&&curr.value==='')?curr:sh;
  if(target&&target.focus) target.focus({preventScroll:true});
}
function closeApt(){
  document.body.classList.remove('sheet-open');
  if(!ui.open) return;
  var all=main.querySelectorAll('.apt[data-apt]'), li=null;
  for(var i=0;i<all.length;i++) if(all[i].dataset.apt===ui.open){ li=all[i]; break; }
  ui.open=null;
  if(!li) return;
  var w=li.querySelector('.sheet-wrap'), had=w&&!w.hidden&&li.contains(document.activeElement);
  if(w) w.hidden=true;
  var b=li.querySelector('.arow'); if(had&&b&&b.focus) b.focus({preventScroll:true});
}
function setAuto(el,val){
  if(!el||el.dataset.auto!=='1'||document.activeElement===el) return;
  el.value=val;
}
function paintMonth(){
  if(ui.tab!=='month'||!document.getElementById('mstatus')) return;
  var ym=ui.ym, v=monthView(S.b,S.months,ym), res=v.res, rec=S.months[ym]||{};
  var byId={}; res.rows.forEach(function(r){byId[r.id]=r;});
  var nameOf={}; v.apts.forEach(function(a){nameOf[a.id]=a.name;});
  var totalDue=0;
  if(res.ok) v.apts.forEach(function(a){ if(v.due[a.id]>0) totalDue+=v.due[a.id]; });
  var ph=document.getElementById('price-hint'); if(ph) ph.hidden=!(v.eff.priceAuto&&v.eff.price!==null);
  document.getElementById('g-kwh').textContent=res.sumKwh>0?fmtNum(res.sumKwh)+' ك.و.س':'—';
  document.getElementById('g-total').textContent=res.ok?fmtMoney(res.totalC)+' ₪':'—';
  document.getElementById('g-due').textContent=res.ok?fmtMoney(totalDue)+' ₪':'—';
  var doneN=res.rows.filter(function(r){return r.kwh!==null;}).length;
  document.getElementById('g-count').textContent=res.rows.length?doneN+' من '+res.rows.length:'—';
  var st=document.getElementById('mstatus'), msg='', kind='';
  if(res.reason==='no-price'){ msg='اكتب سعر الكيلوواط لتظهر المبالغ.'; kind='warn'; }
  else if(res.reason==='incomplete'){
    var names=res.missing.map(function(id){return nameOf[id];}).concat(res.negative.map(function(id){return nameOf[id];}));
    msg='لا يمكن حساب المبالغ بعد. ينقص أو يحتاج مراجعة: '+(names.length>4?names.slice(0,3).join('، ')+' و'+(names.length-3)+' أخرى':names.join('، '))+'.'; kind='warn';
  } else if(res.ok){ msg='الحساب جاهز.'; kind='ok'; }
  st.textContent=msg; st.hidden=!msg; if(kind) st.dataset.k=kind; else delete st.dataset.k;
  var items=main.querySelectorAll('.apt');
  for(var i=0;i<items.length;i++){
    var li=items[i], id=li.dataset.apt, row=byId[id], apt=v.apts.filter(function(a){return a.id===id;})[0];
    if(!row||!apt) continue;
    var q=function(n){return li.querySelector('[data-p="'+n+'"]');};
    q('kwh').textContent=row.kwh===null?'—':fmtNum(row.kwh);
    setAuto(li.querySelector('[data-f="arrears"]'),centsStr(v.arr[id]));
    var issue=q('issue');
    if(row.issue==='negative'){ issue.textContent='القراءة الحالية أقل من السابقة. راجع الرقم.'; issue.style.color='var(--bad)'; issue.hidden=false; }
    else if(row.issue==='missing'){ issue.textContent=row.curr===null?'اكتب القراءة الحالية.':'اكتب القراءة السابقة.'; issue.style.color='var(--ink2)'; issue.hidden=false; }
    else issue.hidden=true;
    var paidC=paidCents(rec,id), pill=q('pill'), wa=q('wa'), rem=q('rem');
    var hasPhone=!!waNumber(apt.phone,ccOf(apt));
    var pe=q('pedit'); if(pe) pe.hidden=!hasPhone;
    if(hasPhone){ wa.textContent='واتساب'; wa.removeAttribute('data-act'); wa.removeAttribute('data-id'); }
    else { wa.textContent='أضف رقم واتساب'; wa.dataset.act='phone-missing'; wa.dataset.id=id; wa.setAttribute('href','#'); wa.removeAttribute('aria-disabled'); }
    var pdfBtn=li.querySelector('[data-act="pdf"]');
    if(res.ok){
      var arr=v.arr[id], due=v.due[id], s=statusOf(due,paidC);
      q('share').textContent=fmtMoney(row.shareC)+' ₪';
      q('due').textContent=fmtMoney(Math.max(0,due))+' ₪';
      pill.dataset.k=s; pill.textContent=s==='paid'?'مسدد':s==='partial'?'دفع جزئي':'غير مدفوع';
      if(hasPhone){ wa.href=waLink(apt.phone,ccOf(apt),statementMessage(S.b.name,ym,apt,row,res.price,arr,paidC)); wa.removeAttribute('aria-disabled'); }
      if(hasPhone&&due>0){ rem.href=waLink(apt.phone,ccOf(apt),reminderMessage(S.b.name,ym,apt,due)); rem.hidden=false; } else rem.hidden=true;
      if(pdfBtn) pdfBtn.disabled=false;
    } else {
      q('share').textContent='—'; q('due').textContent='—';
      pill.dataset.k='pending'; pill.textContent='بانتظار الحساب';
      if(hasPhone){ wa.removeAttribute('href'); wa.setAttribute('aria-disabled','true'); }
      rem.hidden=true;
      if(pdfBtn) pdfBtn.disabled=true;
    }
    var sub=q('sub'), amt=q('amt'), av=q('av'), pill2=q('pill2'), tn=apt.tenant?apt.tenant+' · ':'';
    if(row.issue==='negative'){ sub.textContent=tn+'القراءة تحتاج مراجعة'; amt.textContent=''; pill.dataset.k='unpaid'; pill.textContent='راجع القراءة'; }
    else if(row.issue==='missing'){ sub.textContent=tn+(row.curr===null?(row.prev!==null?'السابقة '+fmtRead(row.prev):'اكتب القراءتين'):'اكتب القراءة السابقة'); amt.textContent=''; pill.dataset.k='todo'; pill.textContent='أدخل القراءة'; }
    else { sub.textContent=tn+fmtNum(row.kwh)+' ك.و.س'; amt.textContent=res.ok?fmtMoney(Math.max(0,v.due[id]))+' ₪':''; }
    av.dataset.k=pill.dataset.k; pill2.dataset.k=pill.dataset.k; pill2.textContent=pill.textContent;
  }
  var fsubs=main.querySelectorAll('[data-p="fl-sub"]');
  for(var fi=0;fi<fsubs.length;fi++){
    var fe=fsubs[fi], fn=Number(fe.dataset.floor), flist=v.apts.filter(function(a){return floorOf(a)===fn;});
    var ftxt=aptCountLabel(flist.length);
    if(res.ok){
      var fdue=0; flist.forEach(function(a){ if(v.due[a.id]>0) fdue+=v.due[a.id]; });
      ftxt+=' · '+(fdue>0?'متبقي '+fmtMoney(fdue)+' ₪':'الكل مسدد');
    }
    fe.textContent=ftxt;
  }
  var g=document.getElementById('wa-group');
  if(res.ok){ g.href=waLink('',S.b.cc,summaryMessage(S.b.name,ym,v,S.months)); g.removeAttribute('aria-disabled'); }
  else { g.removeAttribute('href'); g.setAttribute('aria-disabled','true'); }
  var sb=main.querySelector('[data-act="pdf-summary"]'); if(sb) sb.disabled=!res.ok;
}
function ensureMonth(ym){
  if(!S.months[ym]) S.months[ym]={price:'',readings:{},paid:{},arrears:{}};
  var m=S.months[ym]; m.readings=m.readings||{}; m.paid=m.paid||{}; m.arrears=m.arrears||{};
  return m;
}
function onInput(e){
  var t=e.target;
  if(t.id==='f-search'){ applySearch(); return; }
  if(ui.tab==='apts'&&/^[en]-(phone|cc)$/.test(t.id||'')){ paintPhoneHint(t.id.charAt(0)); return; }
  if(ui.tab==='apts'&&t.id==='n-name'){ t.dataset.auto='0'; return; }
  if(ui.tab==='apts'&&t.id==='n-floor'){
    var nm=document.getElementById('n-name');
    if(nm&&nm.dataset.auto==='1'){ var fv=num(t.value); nm.value=(fv!==null&&fv>=0&&fv<=99)?nextAptName(S.b.apartments,Math.floor(fv),S.b):''; }
    return;
  }
  var f=t.dataset&&t.dataset.f; if(!f||ui.tab!=='month') return;
  var ym=ui.ym, m=ensureMonth(ym), id=t.dataset.id, patch={};
  if(f==='price'){ m.price=t.value; patch.price=t.value; t.dataset.auto=t.value.trim()===''?'1':'0'; }
  else if(f==='prev'||f==='curr'){
    m.readings[id]=m.readings[id]||{prev:'',curr:''}; m.readings[id][f]=t.value;
    patch.readings={}; patch.readings[id]={}; patch.readings[id][f]=t.value;
    if(f==='prev') t.dataset.auto=t.value.trim()===''?'1':'0';
  } else if(f==='paid'){ m.paid[id]=t.value; patch.paid={}; patch.paid[id]=t.value; }
  else if(f==='arrears'){ m.arrears[id]=t.value; patch.arrears={}; patch.arrears[id]=t.value; t.dataset.auto=t.value.trim()===''?'1':'0'; }
  else return;
  paintMonth(); qMonth(ym,patch);
}
function payFull(id){
  var ym=ui.ym, v=monthView(S.b,S.months,ym);
  if(!v.res.ok){ toast('اكتب السعر والقراءات أولاً.'); return; }
  var m=ensureMonth(ym), r=v.res.rows.filter(function(x){return x.id===id;})[0];
  var val=(Math.max(0,v.arr[id]+r.shareC)/100).toFixed(2);
  m.paid[id]=val;
  var inp=document.getElementById('p-'+id); if(inp) inp.value=val;
  var pp={}; pp[id]=val; qMonth(ym,{paid:pp});
  paintMonth();
}

var C_INK='#13201D', C_MUTE='#52625E', C_LINE='#D3DBD8', C_ACC='#1F4FBF', C_ACCS='#E4EBFA', C_OK='#17794A', C_BAD='#B3261E', C_DIAL='#0F1917';
var F_B='"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif', F_D='"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif', F_M='"IBM Plex Mono",Menlo,Consolas,monospace';
function loadFonts(){
  if(!document.fonts||!document.fonts.load) return Promise.resolve();
  return Promise.all([
    document.fonts.load('700 40px "Reem Kufi"','عمارة'),
    document.fonts.load('400 30px "IBM Plex Sans Arabic"','الكهرباء'),
    document.fonts.load('600 30px "IBM Plex Sans Arabic"','الكهرباء'),
    document.fonts.load('600 40px "IBM Plex Mono"','0123456789')
  ]).catch(function(){});
}
function newPage(){
  var c=document.createElement('canvas'); c.width=PW; c.height=PH;
  var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,PW,PH); x.fillStyle=C_ACC; x.fillRect(0,0,PW,14);
  return {c:c,x:x};
}
function tx(x,s,px,py,o){
  o=o||{};
  x.font=(o.w||400)+' '+(o.s||30)+'px '+(o.f||F_B); x.fillStyle=o.c||C_INK;
  x.direction=o.d||'rtl'; x.textAlign=o.a||'right'; x.textBaseline='alphabetic';
  x.fillText(String(s),px,py);
}
function fitTx(x,s,px,py,maxW,o){
  o=o||{}; var z=o.s||30;
  for(;z>20;z-=2){ x.font=(o.w||400)+' '+z+'px '+(o.f||F_B); if(x.measureText(String(s)).width<=maxW) break; }
  var o2={}; for(var k in o) o2[k]=o[k]; o2.s=z;
  var str=String(s);
  x.font=(o.w||400)+' '+z+'px '+(o.f||F_B);
  while(str.length>2&&x.measureText(str).width>maxW) str=str.slice(0,-2)+'…';
  tx(x,str,px,py,o2);
}
function hline(x,y,x1,x2,col,wd){ x.strokeStyle=col||C_LINE; x.lineWidth=wd||2; x.beginPath(); x.moveTo(x1,y); x.lineTo(x2,y); x.stroke(); }
function rrect(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }
function wrapLines(x,s,maxW,font){
  x.font=font; var words=String(s).split(' '), lines=[], cur='';
  words.forEach(function(w){
    var t=cur?cur+' '+w:w;
    if(x.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t;
  });
  if(cur) lines.push(cur);
  return lines;
}
function drawDial(x,val,leftX,top,w,h){
  var s=String(Math.max(0,Math.floor(val))).padStart(6,'0'), n=s.length, gap=6;
  var cw=Math.min(76,(w-gap*(n-1))/n);
  for(var i=0;i<n;i++){
    var px=leftX+i*(cw+gap);
    x.fillStyle=C_DIAL; rrect(x,px,top,cw,h,8); x.fill();
    tx(x,s.charAt(i),px+cw/2,top+h*0.7,{s:Math.round(h*0.58),w:600,f:F_M,c:'#EEF1EA',a:'center',d:'ltr'});
  }
}

function canvasesToPdf(canvases){
  return Promise.all(canvases.map(function(c){
    return new Promise(function(res,rej){ c.toBlob(function(b){ b?res(b):rej(new Error('jpeg')); },'image/jpeg',0.9); })
      .then(function(b){return b.arrayBuffer();})
      .then(function(buf){return {jpeg:new Uint8Array(buf),w:c.width,h:c.height};});
  })).then(function(pages){ return new Blob([buildPdf(pages)],{type:'application/pdf'}); });
}
/* Saving files outside any host app: on phones offer the system share sheet (WhatsApp is one tap away), elsewhere download. */
function downloadShim(){
  return {save:function(r){
    var data=r.data, isPdf=/\.pdf$/i.test(r.filename);
    var blob=(data instanceof Blob)?data:new Blob([data],{type:/\.json$/i.test(r.filename)?'application/json':'text/plain'});
    function viaLink(){
      var u=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=u; a.download=r.filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500);
      return {status:'saved'};
    }
    var touch=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
    if(isPdf&&touch&&navigator.canShare&&navigator.share){
      try{
        var f=new File([blob],r.filename,{type:'application/pdf'});
        if(navigator.canShare({files:[f]})){
          return navigator.share({files:[f]}).then(function(){return {status:'saved'};},function(e){
            if(e&&e.name==='AbortError') throw {code:'declined'};
            return viaLink();
          });
        }
      }catch(e){}
    }
    return Promise.resolve(viaLink());
  }};
}
function saveFile(name,data,okMsg){
  if(!S.dl){ toast('حفظ الملفات غير متاح في هذا العرض.'); return Promise.resolve(); }
  return S.dl.save({filename:name,data:data}).then(function(){ toast(okMsg); }).catch(function(e){
    if(e&&e.code==='declined') return;
    toast('تعذر حفظ الملف.');
  });
}
function safeName(s){ return String(s||'').replace(/[\\\/:*?"<>|]+/g,'-').trim(); }
function setBusy(on){ ui.busy=on; var b=main.querySelectorAll('[data-act="pdf"],[data-act="pdf-summary"]'); for(var i=0;i<b.length;i++) b[i].disabled=on||b[i].disabled; if(!on) paintMonth(); }

function exportStatement(id){
  if(ui.busy) return;
  var ym=ui.ym, v=monthView(S.b,S.months,ym);
  if(!v.res.ok) return;
  var row=v.res.rows.filter(function(r){return r.id===id;})[0], apt=v.apts.filter(function(a){return a.id===id;})[0];
  if(!row||!apt) return;
  var d={building:S.b.name,monthLabel:ymLabel(ym),rangeLabel:ymRange(ym),apt:apt,row:row,price:v.res.price,
    arrC:v.arr[id],paidC:paidCents(S.months[ym],id),issued:new Date().toLocaleDateString('en-CA')};
  setBusy(true); toast('جارٍ تجهيز الملف…');
  loadFonts().then(function(){ return canvasesToPdf(drawStatement(d)); }).then(function(blob){
    return saveFile('كشف كهرباء - '+safeName(apt.name)+' - '+ym+'.pdf',blob,'تم حفظ الملف. أرفقه في محادثة واتساب.');
  }).catch(function(e){ console.warn(e); toast('تعذر تجهيز الملف.'); }).then(function(){ setBusy(false); });
}
function exportSummary(){
  if(ui.busy) return;
  var ym=ui.ym, v=monthView(S.b,S.months,ym);
  if(!v.res.ok) return;
  var totalDue=0;
  var rows=[];
  groupByFloor(v.apts).forEach(function(g){ g.apts.forEach(function(a){
    var r=v.res.rows.filter(function(x){return x.id===a.id;})[0]; if(!r) return;
    totalDue+=Math.max(0,v.due[r.id]);
    rows.push({name:a.name,tenant:a.tenant,floor:g.floor,kwh:r.kwh,shareC:r.shareC,arrC:v.arr[r.id],paidC:paidCents(S.months[ym],r.id),dueC:v.due[r.id]});
  }); });
  var d={building:S.b.name,monthLabel:ymLabel(ym),rangeLabel:ymRange(ym),rows:rows,price:v.res.price,totalC:v.res.totalC,totalDueC:totalDue,sumKwh:v.res.sumKwh,issued:new Date().toLocaleDateString('en-CA')};
  setBusy(true); toast('جارٍ تجهيز الملف…');
  loadFonts().then(function(){ return canvasesToPdf(drawSummary(d)); }).then(function(blob){
    return saveFile('ملخص كهرباء - '+ym+'.pdf',blob,'تم حفظ الملخص. أرفقه في واتساب.');
  }).catch(function(e){ console.warn(e); toast('تعذر تجهيز الملف.'); }).then(function(){ setBusy(false); });
}

  }).join('')||'<p class="lead">لا توجد شقق في هذه الفترة.</p>')+'</section>'+
  '<section class="band"><h3 class="h3">إضافة شقة</h3>'+aptForm(null,'n')+'<div class="btns"><button class="btn primary" data-act="apt-add">إضافة الشقة</button></div>'+
  '<p class="hint" style="margin-top:10px">الشقة الجديدة تدخل الحساب من '+esc(ymLabel(ym))+' فصاعداً، ولا تتغير الفترات السابقة.</p></section>'+renumBand()+
  (inact.length?'<section class="band"><h3 class="h3">شقق غير مفعّلة في هذه الفترة</h3><ul class="rows">'+inact.map(function(a){
    return '<li class="row"><div><div class="apt-name">'+esc(a.name)+'</div><div class="sub">'+esc(a.tenant||'')+'</div></div><button class="btn" data-act="apt-restore" data-id="'+esc(a.id)+'">إعادة تفعيل</button></li>';
  }).join('')+'</ul></section>':'');
  paintPhoneHint('n'); if(ui.edit) paintPhoneHint('e');
}
function renumPlan(){
  var base=aptBase(S.b.perFloor,S.b.ground), cnt={}, out=[];
  groupByFloor(S.b.apartments).forEach(function(g){
    g.apts.forEach(function(a){
      if(!/^شقة\s*\d+$/.test(normDigits(String(a.name)).trim())) return;
      var idx=(cnt[g.floor]=(cnt[g.floor]||0)+1), nn=aptNameFor(g.floor,idx,S.b);
      if(idx<base&&nn!==a.name) out.push({id:a.id,from:a.name,to:nn});
    });
  });
  return out;
}
function renumBand(){
  if(!S.b.apartments.length) return '';
  var plan=renumPlan(), body;
  if(ui.confirm==='renum'&&plan.length) body='<p class="status" data-k="warn">سيتم تغيير اسم '+plan.length+' شقة، مثلاً «'+esc(plan[0].from)+'» تصير «'+esc(plan[0].to)+'». الأسماء الثانية (مثل «الدكان») ما بتتغير، والقراءات والمدفوعات تبقى كما هي.</p><div class="btns"><button class="btn primary" data-act="renum-yes">نعم، غيّر الأسماء</button><button class="btn" data-act="renum-no">إلغاء</button></div>';
  else if(plan.length) body='<div class="btns"><button class="btn" data-act="renum">رتّب أسماء الشقق حسب الطابق</button></div>';
  else body='<p class="hint">كل الأسماء مرتبة.</p>';
  return '<section class="band"><h3 class="h3">ترقيم الشقق</h3><p class="lead">الرقم = رقم الطابق ثم رقم الشقة بخانتين: الأولى في الطابق الأول 101، الثالثة في الرابع 403، والأرضي 1 و2. الشقق الجديدة تُسمّى تلقائياً بهذا الشكل.</p>'+body+'</section>';
}
function renumApply(){
  var plan=renumPlan(), byId={}; plan.forEach(function(p){ byId[p.id]=p.to; });
  S.b.apartments.forEach(function(a){ if(byId[a.id]) a.name=byId[a.id]; });
  ui.confirm=null; qBuilding(); renderApts(); toast('تم تغيير أسماء '+plan.length+' شقة.');
}
function readFloor(id,fallback){ var n=num(valOf(id)); return (n!==null&&n>=0&&n<=99)?Math.floor(n):fallback; }
function addApt(){
  var name=valOf('n-name'); if(!name){ toast('اكتب رقم أو اسم الشقة.'); return; }
  var hasData=Object.keys(S.months).length>0;
  S.b.apartments.push({id:uid(),name:name,tenant:valOf('n-tenant'),phone:valOf('n-phone'),cc:valOf('n-cc'),floor:readFloor('n-floor',autoFloor(S.b.apartments,S.b.perFloor,S.b.ground)),from:hasData?ui.ym:'',to:''});
  qBuilding(); renderApts();
}
function fieldChanged(id){ var e=document.getElementById(id); return !!e&&e.value.trim()!==String(e.dataset.o==null?e.value:e.dataset.o).trim(); }
function saveApt(id){
  var a=S.b.apartments.filter(function(x){return x.id===id;})[0]; if(!a) return;
  /* only fields the person really edited are applied, so a stale form never overwrites what the other person saved meanwhile */
  var name=fieldChanged('e-name')?valOf('e-name'):a.name; if(!name){ toast('اكتب رقم أو اسم الشقة.'); return; }
  a.name=name;
  if(fieldChanged('e-tenant')) a.tenant=valOf('e-tenant');
  if(fieldChanged('e-phone')) a.phone=valOf('e-phone');
  if(fieldChanged('e-cc')) a.cc=valOf('e-cc');
  if(fieldChanged('e-floor')) a.floor=readFloor('e-floor',floorOf(a));
  ui.edit=null; qBuilding(); renderApts();
}
function removeApt(id){
  var a=S.b.apartments.filter(function(x){return x.id===id;})[0]; if(!a) return;
  var prev=ymShift(ui.ym,-1);
  if(a.from&&a.from>prev){ S.b.apartments=S.b.apartments.filter(function(x){return x.id!==id;}); }
  else a.to=prev;
  ui.confirm=null; qBuilding(); renderApts();
}
function restoreApt(id){
  var a=S.b.apartments.filter(function(x){return x.id===id;})[0]; if(!a) return;
  if(a.to&&a.to<ui.ym) a.to='';
  if(a.from&&a.from>ui.ym) a.from=ui.ym;
  qBuilding(); renderApts();
}

/* ----- history ----- */
function renderHistory(){
  var keys=Object.keys(S.months).filter(isValidYm).sort().reverse();
  var carry=carryBefore(S.b,S.months,'9999-12-2');
  var balHtml=groupByFloor(S.b.apartments).map(function(g){
    return '<div class="floor"><div class="floor-bar"><span>'+esc(floorLabel(g.floor))+'</span><span class="fl-sub">'+aptCountLabel(g.apts.length)+'</span></div><ul class="rows">'+g.apts.map(function(a){
      var c=carry[a.id]||0;
      var k=c>0?'unpaid':c<0?'partial':'paid', t=c>0?'عليه '+fmtMoney(c)+' ₪':c<0?'له '+fmtMoney(-c)+' ₪':'مسدّد';
      return '<li class="row"><div><div class="apt-name">'+esc(a.name)+'</div><div class="sub">'+esc(a.tenant||'')+'</div></div><span class="pill" data-k="'+k+'">'+t+'</span></li>';
    }).join('')+'</ul></div>';
  }).join('');
  var mHtml=keys.map(function(k){
    var v=monthView(S.b,S.months,k), collected=0;
    v.apts.forEach(function(a){collected+=paidCents(S.months[k],a.id);});
    var sub=v.res.ok?'المجموع '+fmtMoney(v.res.totalC)+' ₪ · المدفوع '+fmtMoney(collected)+' ₪':'غير مكتمل';
    return '<li class="row"><div><div class="apt-name">'+esc(ymLabel(k))+'</div><div class="sub">'+sub+'</div></div><button class="btn" data-act="open-month" data-ym="'+k+'">فتح</button></li>';
  }).join('');
  main.innerHTML=
  '<section class="band"><h2 class="h2">السجل</h2><p class="lead">كل الفترات التي أدخلت بياناتها، وما على كل شقة من رصيد.</p></section>'+
  '<section class="band"><h3 class="h3">أرصدة الشقق</h3>'+(keys.length?balHtml+'<p class="hint" style="margin-top:10px">الرصيد يحسب من آخر فترة مكتملة لكل شقة.</p>':'<p class="lead">لا توجد فترات بعد. ابدأ من قسم الكشف.</p>')+'</section>'+
  '<section class="band"><h3 class="h3">الفترات</h3>'+(keys.length?'<ul class="rows">'+mHtml+'</ul>':'<p class="lead">لا توجد فترات بعد.</p>')+'</section>';
}

/* ----- settings / backup ----- */
function renderSettings(){
  var cloud=isCloud();
  var rn=ui.restore?ui.restore.b.apartments.length:0, rm=ui.restore?Object.keys(ui.restore.months).length:0;
  main.innerHTML=
  '<section class="band"><h2 class="h2">الإعدادات</h2></section>'+
  (cloud?'<section class="band"><h3 class="h3">الحساب والمزامنة</h3><p class="lead" style="margin-bottom:8px">بيانات العمارة مشتركة: أي تعديل تعمله يظهر عند الطرف الآخر، وأي تعديل منه يظهر عندك.</p><p class="hint" style="margin:0 0 12px">مسجّل الدخول باسم <span class="num">'+esc(fb.user&&fb.user.email||'')+'</span></p><div class="btns" style="margin-top:0"><button class="btn" data-act="signout">تسجيل الخروج</button></div></section>':'')+
  '<section class="band"><h3 class="h3">العمارة</h3><div class="two">'+
  '<div class="field"><label for="st-name">اسم العمارة</label><input class="in" id="st-name" data-st="name" value="'+esc(S.b.name)+'" autocomplete="off"></div>'+
  '<div class="field"><label for="st-cc">مفتاح الدولة لأرقام واتساب</label><input class="in" id="st-cc" data-st="cc" value="'+esc(S.b.cc||'970')+'" inputmode="numeric" dir="ltr" autocomplete="off"><span class="hint">الأرقام التي تبدأ بصفر مثل 0599123456 تتحول إلى الصيغة الدولية بهذا المفتاح (970 أو 972). وإذا كتبت الرقم كاملاً مع المفتاح (+972…) يُستخدم كما هو.</span></div>'+
  '<div class="field"><label for="st-ground">عدد شقق الطابق الأرضي</label><input class="in" id="st-ground" data-st="ground" value="'+esc(groundCap(S.b.ground))+'" inputmode="numeric" dir="ltr" autocomplete="off"><span class="hint">0 = لا توجد شقق في الأرضي. يُستخدم لتوزيع الشقق الجديدة فقط.</span></div>'+
  '<div class="field"><label for="st-per">عدد الشقق في كل طابق بعد الأرضي</label><input class="in" id="st-per" data-st="per" value="'+esc(S.b.perFloor||6)+'" inputmode="numeric" dir="ltr" autocomplete="off"><span class="hint">يُستخدم لتوزيع الشقق الجديدة على الطوابق. تقدر تغيّر طابق أي شقة من قسم الشقق.</span></div></div></section>'+
  '<section class="band"><h3 class="h3">نسخة احتياطية</h3><p class="lead">'+(cloud?'بيانات العمارة محفوظة على الإنترنت ومشتركة. النسخة الاحتياطية ملف تحفظه عندك للاطمئنان، واستعادتها تستبدل البيانات عند الجميع.':'بياناتك محفوظة في هذا المتصفح فقط. خذ نسخة احتياطية بعد كل كشف.')+'</p>'+
  '<div class="btns">'+(S.dl?'<button class="btn primary" data-act="backup">حفظ نسخة احتياطية</button>':'')+'<button class="btn" data-act="restore">استعادة من نسخة</button></div>'+
  (ui.confirm==='restore'&&ui.restore?'<p class="status" data-k="bad">سيتم استبدال بيانات العمارة الحالية'+(cloud?' (وسيراها المدير كذلك)':'')+' بمحتوى النسخة التي اخترتها: '+aptCountLabel(rn)+' و'+rm+' من الفترات.</p><div class="btns"><button class="btn danger" data-act="restore-yes">استبدال البيانات</button><button class="btn" data-act="restore-no">إلغاء</button></div>':'')+'</section>'+
  '<section class="band"><h3 class="h3">مسح كل البيانات</h3>'+
  (ui.confirm==='clear'?'<p class="status" data-k="bad">سيتم حذف الشقق والفترات والدفعات نهائياً'+(cloud?' عند الجميع، ولن يراها المدير بعد الآن':'')+'. خذ نسخة احتياطية قبل ذلك.</p><div class="btns"><button class="btn danger" data-act="clear-yes">نعم، امسح كل شيء</button><button class="btn" data-act="clear-no">إلغاء</button></div>':'<div class="btns"><button class="btn danger" data-act="clear">مسح كل البيانات</button></div>')+'</section>';
}
function doBackup(){
  var o={app:'kahraba',v:4,exported:new Date().toISOString(),building:cleanBuilding(),months:S.months};
  saveFile('نسخة كهربا - '+new Date().toLocaleDateString('en-CA')+'.json',JSON.stringify(o,null,1),'تم حفظ النسخة الاحتياطية.');
}
function applyRestore(r){
  S.b=r.b; S.months=r.months; ui.tab='month'; ui.ym=Object.keys(S.months).sort().pop()||ymNow(); ui.confirm=null; ui.restore=null;
  persistAll(); renderAll(); toast('تمت استعادة النسخة.');
}
function pickBackup(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var r;
      try{
        var o=JSON.parse(String(rd.result));
        if(!o||!o.building||!Array.isArray(o.building.apartments)||typeof o.months!=='object') throw new Error('format');
        r={b:normBuilding(o.building),months:{}};
        Object.keys(o.months||{}).forEach(function(k){ if(isValidYm(k)) r.months[k]=cleanMonth(o.months[k]); });
      }catch(e){ toast('هذا الملف ليس نسخة احتياطية صالحة.'); return; }
      if(S.b.apartments.length||Object.keys(S.months).length){ ui.restore=r; ui.confirm='restore'; ui.tab='settings'; renderAll(); window.scrollTo(0,0); }
      else applyRestore(r);
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ----- events ----- */
function onClick(e){
  var t=e.target.closest('[data-act]'); if(!t||t.disabled||t.getAttribute('aria-disabled')==='true') return;
  var act=t.dataset.act, id=t.dataset.id;
  switch(act){
    case 'prev': ui.ym=ymShift(ui.ym,-1); ui.search=''; renderMonth(); break;
    case 'next': ui.ym=ymShift(ui.ym,1); ui.search=''; renderMonth(); break;
    case 'payfull': payFull(id); break;
    case 'open-apt': openApt(id); break;
    case 'close-apt': closeApt(); break;
    case 'phone-missing': e.preventDefault(); ui.tab='apts'; ui.edit=id; ui.confirm=null; renderAll(); window.scrollTo(0,0); toast('اكتب رقم واتساب الشقة هنا مرة وحدة، وبيتحفظ.'); break;
    case 'floor-toggle': {
      var fw=document.getElementById('fl-'+t.dataset.floor), fu=fw&&fw.querySelector('.apts');
      if(fu){ fu.hidden=!fu.hidden; ui.collapsed[t.dataset.floor]=fu.hidden; t.setAttribute('aria-expanded',fu.hidden?'false':'true'); }
      break; }
    case 'floor-go': {
      var gw=document.getElementById('fl-'+t.dataset.floor); if(!gw) break;
      var gu=gw.querySelector('.apts');
      if(gu&&gu.hidden){ gu.hidden=false; ui.collapsed[t.dataset.floor]=false; gw.querySelector('.floor-head').setAttribute('aria-expanded','true'); }
      if(gw.scrollIntoView) gw.scrollIntoView({behavior:'smooth',block:'start'});
      break; }
    case 'pdf': exportStatement(id); break;
    case 'pdf-summary': exportSummary(); break;
    case 'open-month': ui.tab='month'; ui.ym=t.dataset.ym; renderAll(); window.scrollTo(0,0); break;
    case 'setup-start': startSetup(); break;
    case 'setup-sample': loadSample(); break;
    case 'sample-clear': clearAll(); break;
    case 'restore': pickBackup(); break;
    case 'apt-add': addApt(); break;
    case 'apt-edit': ui.edit=id; ui.confirm=null; renderApts(); break;
    case 'apt-save': saveApt(id); break;
    case 'apt-cancel': ui.edit=null; renderApts(); break;
    case 'apt-rm': ui.confirm='rm:'+id; ui.edit=null; renderApts(); break;
    case 'apt-rm-yes': removeApt(id); break;
    case 'apt-rm-no': ui.confirm=null; renderApts(); break;
    case 'apt-restore': restoreApt(id); break;
    case 'backup': doBackup(); break;
    case 'clear': ui.confirm='clear'; renderSettings(); break;
    case 'clear-no': ui.confirm=null; renderSettings(); break;
    case 'clear-yes': clearAll(); break;
    case 'signout': signOutNow(); break;
    case 'renum': ui.confirm='renum'; renderApts(); break;
    case 'renum-no': ui.confirm=null; renderApts(); break;
    case 'renum-yes': renumApply(); break;
    case 'phone-edit': e.preventDefault(); ui.tab='apts'; ui.edit=id; ui.confirm=null; renderAll(); window.scrollTo(0,0); toast('غيّر مفتاح الدولة ثم اضغط «جرّب الرقم على واتساب».'); break;
    case 'retry': location.reload(); break;
    case 'adopt-local': adoptLocal(); break;
    case 'restore-yes': if(ui.restore) applyRestore(ui.restore); break;
    case 'restore-no': ui.confirm=null; ui.restore=null; renderSettings(); break;
  }
}
function onChange(e){
  var t=e.target, k=t.dataset&&t.dataset.st, f=t.dataset&&t.dataset.f;
  if(f==='arrears'){ paintMonth(); return; }
  if(!k) return;
  if(k==='name') S.b.name=t.value.trim();
  if(k==='cc') S.b.cc=t.value.replace(/\D/g,'')||'970';
  if(k==='ground'){ var gn=num(t.value); S.b.ground=gn===null?0:groundCap(gn); t.value=String(S.b.ground); }
  if(k==='per') S.b.perFloor=Math.min(30,Math.max(1,Math.round(num(t.value)||6)));
  qBuilding(); renderHeader();
}
main.addEventListener('click',onClick);
main.addEventListener('input',onInput);
main.addEventListener('change',onChange);
main.addEventListener('submit',function(e){ if(e.target&&e.target.id==='login-form'){ e.preventDefault(); doLogin(); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&ui.open) closeApt(); });
document.getElementById('tabs').addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]'); if(!t) return;
  ui.tab=t.dataset.tab; ui.edit=null; ui.confirm=null; renderAll(); window.scrollTo(0,0);
});

document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');
renderHeader();
load();
})();
</script>
</body>
</html>
